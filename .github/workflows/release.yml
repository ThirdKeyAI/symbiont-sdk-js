name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual re-run, e.g. after a transient registry failure. Publishes whatever
  # versions are checked out on main; versions already on npm are skipped.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/examples is a workspace with no build script, so a bare
      # --workspaces run fails on it. --if-present skips it.
      - name: Build all workspace packages
        run: npm run build --workspaces --if-present

      - name: Type-check workspace
        run: npm run type-check

      - name: Run tests
        run: npx vitest run

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    # A tag release, or a manual dispatch from main. This keeps NPM_TOKEN away
    # from a dispatch against an arbitrary branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build all workspace packages
        run: npm run build --workspaces --if-present

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi
          echo "Releasing $pkg"

      # symbi-types is the only leaf; symbi-core and symbi-agent depend on each
      # other, so no total order exists. npm does not build-verify dependents at
      # publish time and the workspace ranges are already satisfied by earlier
      # releases, so a cycle does not block publishing -- publish the leaf first
      # and the rest after, and let each package skip itself if it is already up.
      - name: Require a registry token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set on this repository. Add it under" >&2
            echo "Settings > Secrets and variables > Actions, then re-run." >&2
            exit 1
          fi

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          publish_one() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip  $name@$version (already on npm)"
              return 0
            fi
            echo "publish $name@$version"
            (cd "$dir" && npm publish --access public)
          }

          publish_one packages/types
          for dir in packages/*/; do
            case "$dir" in
              packages/types/) continue ;;
            esac
            publish_one "${dir%/}"
          done

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract the changelog section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section runs to the next version heading.
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; print; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version; falling back to the tag name" >&2
            echo "Release $GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
